{{- $config := .Values.server }}
{{- $shared := not (empty $config.database.existingSecret) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recoder.name" $ }}
  labels:
    {{- include "recoder.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ $config.replicaCount }}
  strategy:
    {{- if $shared }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Chart.Name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "recoder.labels" $ | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      {{- if gt (int $config.replicaCount) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $.Chart.Name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: server
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ printf "%s:%s" $config.image.repository ($config.image.tag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $config.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
            - name: HOME
              value: /tmp
            - name: FRONTEND_URL
              value: {{ $config.frontendUrl | quote }}
            - name: RECODER_DATA_DIR
              value: /app/data
            - name: RECODER_WORKDIR
              value: /tmp/recoder-work
            - name: RECODER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $config.encryptionKey.existingSecret }}
                  key: {{ $config.encryptionKey.secretKey }}
            {{- if $shared }}
            - name: RECODER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $config.database.existingSecret }}
                  key: {{ $config.database.secretKey }}
            {{- end }}
            {{- if $config.managedCommand }}
            - name: RECODER_MANAGED_COMMAND
              value: {{ $config.managedCommand | quote }}
            {{- end }}
            {{- range $name, $value := $config.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $config.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ $config.existingSecret }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ ternary "/health/ready" "/health" $shared }}
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ ternary "/health/ready" "/health" $shared }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: work
              mountPath: /tmp/recoder-work
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $config.tmpSizeLimit }}
        - name: data
          {{- if $shared }}
          emptyDir:
            sizeLimit: {{ $config.dataSizeLimit }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ $config.persistence.existingClaim | default (printf "%s-data" (include "recoder.name" $)) }}
          {{- end }}
        - name: work
          emptyDir:
            sizeLimit: {{ $config.workSizeLimit }}
