---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recoder.name" $ }}
  labels:
    {{- include "recoder.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: server
