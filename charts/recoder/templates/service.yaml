{{- range $component := list "server" "app" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recoder.name" $ }}-{{ $component }}
  labels:
    {{- include "recoder.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ ternary 3001 3000 (eq $component "server") }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
