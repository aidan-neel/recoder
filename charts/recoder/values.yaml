imagePullSecrets: []

server:
  replicaCount: 1
  database:
    existingSecret: ''
    secretKey: RECODER_DATABASE_URL
  encryptionKey:
    existingSecret: ''
    secretKey: RECODER_SECRET_KEY
  image:
    repository: ghcr.io/aidan-neel/recoder
    tag: ''
    pullPolicy: IfNotPresent
  frontendUrl: https://recoder.example.org
  managedCommand: ''
  existingSecret: ''
  env:
    RECODER_EXEC: 'off'
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  workSizeLimit: 10Gi
  tmpSizeLimit: 1Gi
  dataSizeLimit: 1Gi
  persistence:
    existingClaim: ''
    storageClass: null
    size: 10Gi
