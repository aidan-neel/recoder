<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Geist+Mono:wght@400;500&amp;display=swap"><style>@keyframes rc-spin{to{transform:rotate(360deg)}}</style></helmet>
<div style="width:100%;height:100%;display:flex;align-items:center;gap:4px;padding:0 10px 0 14px;box-sizing:border-box;background:#0d0c0b;font-family:{{ sansFam }};color:#ede9e3;user-select:none">
  <div style="display:flex;align-items:center;gap:8px;padding:0 10px 0 2px">
    
    <span style="font-size:14px;font-weight:500;letter-spacing:-0.01em">Recoder</span>
  </div>
  <div style="height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:8px;background:{{ homeBg }};box-shadow:{{ homeRing }};color:{{ homeFg }};font-size:13px">{{ ic.inbox }}Home<span style="font-family:'Geist Mono',monospace;font-size:11px;color:#6f6a63">4</span></div>
  <sc-if value="{{ hasTabs }}" hint-placeholder-val="{{ true }}">
  <span style="width:1px;height:16px;background:#262422;margin:0 6px"></span>
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
    <div style="height:30px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:8px;background:{{ t.bg }};box-shadow:{{ t.ring }};color:{{ t.fg }};font-size:13px;white-space:nowrap">
      <span style="display:flex;align-items:center;color:{{ t.iconColor }}">{{ t.icon }}</span>
      <span>{{ t.repo }}</span><span style="font-family:'Geist Mono',monospace;font-size:11.5px;color:#6f6a63">{{ t.pr }}</span>
      <span style="font-family:'Geist Mono',monospace;font-size:10.5px;padding:0 5px;border-radius:4px;color:{{ t.badgeFg }};background:{{ t.badgeBg }}">{{ t.badge }}</span>
    </div>
  </sc-for>
  <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:#6f6a63">{{ ic.plus }}</div>
  </sc-if>
  <div style="flex:1"></div>
  <div style="width:280px;height:30px;display:flex;align-items:center;gap:8px;padding:0 7px 0 10px;border-radius:8px;background:#151413;box-shadow:inset 0 0 0 1px #1f1e1c;color:#6f6a63;font-size:13px">{{ ic.search }}<span style="flex:1">Search or ask Recoder</span><span style="font-family:'Geist Mono',monospace;font-size:10.5px;padding:1px 5px;border-radius:4px;background:#1f1e1c;color:#8a857d">⌘K</span></div>
  <div style="display:flex;align-items:center;gap:7px;height:30px;padding:0 8px;margin-left:4px;border-radius:8px;font-family:'Geist Mono',monospace;font-size:11px;color:#8a857d"><span style="width:26px;height:3px;border-radius:2px;background:#232120;overflow:hidden;display:block"><span style="display:block;width:38%;height:100%;background:#a39e96"></span></span>38%</div>
  <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#8a857d">{{ ic.settings }}</div>
  <div style="width:26px;height:26px;border-radius:13px;background:#2a2826;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:500;color:#cfcac2;margin-left:2px">AN</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:46},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;r4127&quot;,&quot;r160&quot;,&quot;r902&quot;,&quot;r88&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;live&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  icons() {
    if (this._ic) return this._ic;
    const h = React.createElement;
    const P = {
      search: [['circle', { cx: 11, cy: 11, r: 8 }], ['path', { d: 'm21 21-4.3-4.3' }]],
      inbox: [['path', { d: 'M22 12h-6l-2 3h-4l-2-3H2' }], ['path', { d: 'M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z' }]],
      plus: [['path', { d: 'M5 12h14' }], ['path', { d: 'M12 5v14' }]],
      settings: [['path', { d: 'M20 7h-9' }], ['path', { d: 'M14 17H5' }], ['circle', { cx: 17, cy: 17, r: 3 }], ['circle', { cx: 7, cy: 7, r: 3 }]],
      gitPr: [['circle', { cx: 18, cy: 18, r: 3 }], ['circle', { cx: 6, cy: 6, r: 3 }], ['path', { d: 'M13 6h3a2 2 0 0 1 2 2v7' }], ['line', { x1: 6, x2: 6, y1: 9, y2: 21 }]],
      loader: [['path', { d: 'M21 12a9 9 0 1 1-6.219-8.56' }]]
    };
    const mk = (n, s) => h('svg', { width: s, height: s, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.75, strokeLinecap: 'round', strokeLinejoin: 'round', style: { display: 'block', flexShrink: 0 } }, P[n].map((e, i) => h(e[0], Object.assign({ key: i }, e[1]))));
    this._ic = { search: mk('search', 14), inbox: mk('inbox', 14), plus: mk('plus', 14), settings: mk('settings', 15), pr: mk('gitPr', 13),
      spin: h('span', { style: { display: 'inline-flex', animation: 'rc-spin 0.9s linear infinite' } }, mk('loader', 12)) };
    return this._ic;
  }
  renderVals() {
    const ic = this.icons();
    const active = this.props.active ?? 'home';
    const live = this.props.live ?? false;
    const on = { bg: '#1c1b19', ring: 'inset 0 0 0 1px #2a2826', fg: '#ede9e3' };
    const off = { bg: 'transparent', ring: 'none', fg: '#a39e96' };
    const tab = (id, repo, pr, iconColor, badge, badgeFg, badgeBg, spinning) => Object.assign({ repo, pr, icon: spinning ? ic.spin : ic.pr, iconColor, badge, badgeFg, badgeBg }, id === active ? on : off);
    const tabs = [
      tab('r4127', 'ledger-api', '#4127', live ? '#e9c07a' : '#a39e96', live ? '4/6' : '6', '#a39e96', 'rgba(255,245,230,0.06)', live),
      tab('r160', 'sivir-ui', '#160', '#86c98c', '2', '#6f6a63', 'transparent'),
      tab('r902', 'gateway', '#902', '#f08a7e', 'failed', '#f08a7e', 'rgba(240,138,126,0.12)'),
      tab('r88', 'recoder', '#88', '#86c98c', '1 high', '#f4a097', 'rgba(240,138,126,0.13)')
    ];
    const home = active === 'home' ? on : off;
    return { sansFam: this.props.sans ?? "'Geist',system-ui,sans-serif", ic, tabs, hasTabs: !(this.props.empty ?? false), homeBg: home.bg, homeRing: home.ring, homeFg: home.fg };
  }
}
</script>
</body>
</html>
