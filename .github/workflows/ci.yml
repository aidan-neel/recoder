name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.task }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: shared, task: check }
          - { package: shared, task: test }
          - { package: server, task: check }
          - { package: server, task: test }
          - { package: web, task: check }
          - { package: web, task: build }
          - { package: site, task: check }
          - { package: site, task: build }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun run ${{ matrix.task }} (@recoder/${{ matrix.package }})
        run: bunx turbo run ${{ matrix.task }} --filter=@recoder/${{ matrix.package }}
