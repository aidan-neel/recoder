name: CI

# One job runs `bun run verify`, the same command contributors run before pushing. Turbo skips every task whose
# inputs match a cached run, so a change pays only for the packages it touches. A branch push alone starts
# nothing: pull requests and main are the only triggers, so no commit is verified twice.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_RUN_SUMMARY: true
  TEST_DATABASE_URL: postgres://recoder:recoder-test-only@127.0.0.1:5432/recoder
  RECODER_POSTGRES_TEST_URL: postgres://recoder:recoder-test-only@127.0.0.1:5432/recoder

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Restore the turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Start PostgreSQL when the HA suite has to run
        run: .github/scripts/start-postgres-for-ha.sh
      - name: Verify
        run: bun run verify
      - name: Keep only the cache entries this run used
        id: cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .github/scripts/prune-turbo-cache.sh
      - name: Save the turbo cache
        if: ${{ !cancelled() && steps.cache.outputs.changed == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
