name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha:
    name: HA (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ['1.3.14', '1.4.4']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recoder
          POSTGRES_PASSWORD: recoder-test-only
          POSTGRES_DB: recoder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoder -d recoder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://recoder:recoder-test-only@127.0.0.1:5432/recoder
      RECODER_POSTGRES_TEST_URL: postgres://recoder:recoder-test-only@127.0.0.1:5432/recoder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun test apps/server/tests/integration apps/server/tests/config/shared-settings.test.ts

  ci:
    name: ${{ matrix.task }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: shared, task: check }
          - { package: shared, task: test }
          - { package: shared, task: lint }
          - { package: ui, task: check }
          - { package: ui, task: test }
          - { package: ui, task: lint }
          - { package: server, task: check }
          - { package: server, task: test }
          - { package: server, task: lint }
          - { package: web, task: check }
          - { package: web, task: test }
          - { package: web, task: build }
          - { package: web, task: lint }
          - { package: app, task: check }
          - { package: app, task: test }
          - { package: app, task: build }
          - { package: app, task: lint }
          - { package: site, task: check }
          - { package: site, task: test }
          - { package: site, task: build }
          - { package: site, task: lint }
          - { package: bench, task: check }
          - { package: bench, task: test }
          - { package: bench, task: build }
          - { package: bench, task: lint }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun run ${{ matrix.task }} (@recoder/${{ matrix.package }})
        run: bunx turbo run ${{ matrix.task }} --filter=@recoder/${{ matrix.package }}

  deadcode:
    name: deadcode (repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun run deadcode (knip + jscpd)
        run: bun run deadcode
